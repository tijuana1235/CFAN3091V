<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%"
     role="img" aria-labelledby="pv-title pv-desc" style="max-width:720px;height:auto">
  <title id="pv-title">Two expected distributions and where one result falls</title>
  <desc id="pv-desc">Two bell curves on the same axis. The left curve, solid blue,
  is the range of results expected if there is no effect. The right curve, dashed
  orange, is the range expected if there is a real effect. The curves overlap
  heavily in the middle. A single observed result is marked with a vertical line
  inside that overlap, so it is a plausible outcome under either curve. The shaded
  and hatched area is the part of the no-effect curve at or beyond the observed
  result, which is the p-value.</desc>
  <defs>
    <pattern id="pv-hatch" width="7" height="7" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2a78d6" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="720" height="330" fill="#fcfcfb"/>

